<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Protocolo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 card p-4 shadow">
                <h2 class="text-center mb-4">🔍 Consultar Solicitação</h2>
                <form th:action="@{/consulta}" method="get">
                    <div class="mb-3">
                        <label class="form-label">Digite o número do seu protocolo</label>
                        <input type="text" name="protocolo" class="form-control" placeholder="Ex: PROT-XXXX" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">Acompanhar Andamento</button>
                        <a href="/" class="btn btn-outline-secondary">Voltar ao Menu</a>
                    </div>
                </form>
                <div th:if="${param.erro}" class="alert alert-danger mt-3">
                    Solicitação não encontrada. Verifique o número do protocolo.
                </div>
            </div>
        </div>
    </div>
</body>
</html>
