<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Solicitações - Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .btn-menu { height: 80px; font-size: 1.2rem; margin-bottom: 15px; text-align: left; }
    </style>
</head>
<body th:with="usuario=${session.usuario}">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <h1 class="mb-4">Olá! O que deseja fazer?</h1>
                <div class="d-grid gap-2">
                    <a href="/criar" class="btn btn-primary btn-menu">📝 Criar solicitação</a>
                    <a href="/buscar" class="btn btn-info btn-menu text-white">🔍 Buscar por protocolo</a>

                    <!-- Opções Visíveis apenas para Logados -->
                    <a th:if="${usuario != null}" href="/listar" class="btn btn-secondary btn-menu">📋 Listar solicitações</a>
                    <a th:if="${usuario != null}" href="/atualizar" class="btn btn-warning btn-menu">🛠️ Atualizar status</a>

                    <!-- Botão de Login/Logout -->
                    <a th:if="${usuario == null}" href="/login" class="btn btn-outline-dark btn-menu">🔑 Acesso do Servidor (Login)</a>
                    <a th:if="${usuario != null}" href="/logout" class="btn btn-danger btn-menu">🚪 Sair do Sistema</a>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
