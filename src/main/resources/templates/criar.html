<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Solicitação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 card p-4 shadow">
                <h2 class="text-center mb-4">📝 Nova Solicitação</h2>
                <form th:action="@{/salvar}" th:object="${solicitacao}" method="post">
                    <div class="mb-3">
                        <label class="form-label">O que está acontecendo? (Categoria)</label>
                        <select class="form-select" th:field="*{categoria}" required>
                            <option value="" selected disabled>Selecione uma opção</option>
                            <option value="Iluminação">💡 Iluminação Pública</option>
                            <option value="Buraco">🕳️ Buraco na Via</option>
                            <option value="Limpeza">🧹 Limpeza Urbana</option>
                            <option value="Outros">⚙️ Outros</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Explique o problema</label>
                        <textarea class="form-control" th:field="*{descricao}" rows="3" placeholder="Ex: A lâmpada do poste em frente ao mercado está queimada" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Onde fica? (Bairro ou referência)</label>
                        <input type="text" class="form-control" th:field="*{localizacao}" placeholder="Ex: Bairro Centro, perto da Igreja" required>
                    </div>
                    <div class="mb-3 form-check form-switch">
                        <input class="form-check-input" type="checkbox" th:field="*{anonimo}" id="anonimo">
                        <label class="form-check-label" for="anonimo">Deseja fazer este pedido de forma anônima?</label>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success btn-lg">Enviar Solicitação</button>
                        <a href="/" class="btn btn-outline-secondary">Voltar ao Menu</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
