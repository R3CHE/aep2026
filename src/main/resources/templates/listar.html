<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listar Solicitações</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-center mb-4">📋 Lista de Solicitações</h2>
        <div class="card shadow p-3">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Protocolo</th>
                        <th>Categoria</th>
                        <th>Localização</th>
                        <th>Status</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="s : ${solicitacoes}">
                        <td th:text="${s.protocolo}"></td>
                        <td th:text="${s.categoria}"></td>
                        <td th:text="${s.localizacao}"></td>
                        <td><span class="badge bg-primary" th:text="${s.status}"></span></td>
                        <td>
                            <a th:href="@{/consulta(protocolo=${s.protocolo})}" class="btn btn-sm btn-info text-white">Ver Detalhes</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(solicitacoes)}">
                        <td colspan="5" class="text-center">Nenhuma solicitação encontrada.</td>
                    </tr>
                </tbody>
            </table>
            <div class="text-center mt-3">
                <a href="/" class="btn btn-secondary">Voltar ao Menu Principal</a>
            </div>
        </div>
    </div>
</body>
</html>
