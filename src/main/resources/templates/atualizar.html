<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar Status</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 card p-4 shadow">
                <h2 class="text-center mb-4">🛠️ Atualização de Status</h2>
                <form th:action="@{/atualizar-status}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Protocolo da Solicitação</label>
                        <input type="text" name="protocolo" class="form-control" placeholder="PROT-XXXX" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Novo Status</label>
                        <select name="status" class="form-select" required>
                            <option value="" selected disabled>Selecione o status</option>
                            <option value="TRIAGEM">Triagem</option>
                            <option value="EXECUCAO">Em Execução</option>
                            <option value="RESOLVIDO">Resolvido</option>
                            <option value="ENCERRADO">Encerrado</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Comentário (Obrigatório)</label>
                        <textarea name="comentario" class="form-control" rows="3" placeholder="Descreva a ação tomada ou o motivo da mudança" required></textarea>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-warning btn-lg text-dark">Salvar Alteração</button>
                        <a href="/" class="btn btn-outline-secondary">Voltar ao Menu</a>
                    </div>
                </form>
                <div th:if="${erro}" class="alert alert-danger mt-3" th:text="${erro}"></div>
            </div>
        </div>
    </div>
</body>
</html>
